<mat-toolbar>
  <a class="page-title" routerLink="/day">Programmer's Journal</a>

  <nav class="nav-links" aria-label="Main">
    @for (link of links; track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ link.label }}</a>
    }
  </nav>

  <button mat-icon-button class="nav-menu-button" [matMenuTriggerFor]="navMenu" aria-label="Open navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #navMenu="matMenu">
    @for (link of links; track link.path) {
      <a mat-menu-item [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ link.label }}</a>
    }
  </mat-menu>
</mat-toolbar>
