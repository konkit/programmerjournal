<form class="quick-add" (submit)="$event.preventDefault(); submit()">
  <mat-icon class="quick-add-icon" aria-hidden="true">add</mat-icon>
  <input class="quick-add-input"
         [formControl]="newEntryFormControl"
         [readonly]="submitting()"
         (keydown.escape)="cancelEdit()"
         placeholder="Add a task… (start with “-” for a note)"
         aria-label="New task. Start with a dash to add a note instead."
         autocomplete="off"/>
  <button mat-button type="submit" [disabled]="!newEntryFormControl.value.trim() || submitting()">Add</button>
</form>
