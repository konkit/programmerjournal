<div class="flex-column" cdkDrag [cdkDragData]="entry()!.rank" [cdkDragDisabled]="entry()!.status === 'TaskDone'">
  <div class="list-item-wrapper  flex-row">
    <div class="drag-wrapper">
      @if (!['TaskSnoozed', 'TaskMigrated', 'TaskCancelled'].includes(entry()!.status) ) {
      <mat-icon class="drag-handle"
                cdkDragHandle
                aria-hidden="true"
                fontIcon="drag_indicator">
      </mat-icon>
      }
    </div>

    <div class="list-item flex-row"
         [attr.data-task-id]="entry()!.id"
         [class.disabled]="entry()!.status === 'TaskSnoozed' || entry()!.status === 'TaskMigrated' || entry()!.status === 'TaskCancelled'"
         [class.done]="entry()!.status === 'TaskDone'">

      <app-status-button [entry]="entry()"
                         (onTaskAsCreated)="markTaskAsCreated()"
                         (onTaskDone)="markTaskAsDone()"
                         (onTaskSnoozed)="snoozeTask()"
                         (onTaskCanceled)="cancelTask()"
                         (onTaskToMonthly)="migrateToMonthly()"
                         (onTaskToWeekly)="migrateToWeekly()"
                         (onTaskToDaily)="migrateToDaily()"
                         (onEntryDelete)="deleteEntry()"
                         (onAddUpdate)="addUpdate()">
      </app-status-button>

      @if (!isEdited()) {
        <div class="task-title"
             [matTooltip]="entry()?.title"
             [innerHTML]="entry()!.title || '(empty)' | markdown | renderLinks"
             (blur)="submitTitleEditWithValue($event)">
        </div>

        <button mat-icon-button class="row-action" (click)="setEdited(true)" aria-label="Edit title">
          <mat-icon>edit</mat-icon>
        </button>
      } @else {
        <div class="task-title">
          <input [formControl]="fc" aria-label="Task title"/>
        </div>

        <button mat-icon-button (click)="submitTitleEditWithValue($event)" aria-label="Save title">
          <mat-icon>check</mat-icon>
        </button>
        <button mat-icon-button (click)="cancelEdit($event)" aria-label="Cancel editing">
          <mat-icon>cancel</mat-icon>
        </button>
      }

      @if (isTask()) {
        <button mat-icon-button class="task-menu-button row-action" (click)="toggleUpdates()"
                [attr.aria-expanded]="updatesVisible()" aria-label="Show task update">
          <mat-icon>more_vert</mat-icon>
        </button>
      }
    </div>

  </div>

  @if (updatesVisible() && isTask()) {
    <div class="update-wrapper">
      @if (!isUpdateEdited()) {
        <div (blur)="submitUpdateEditWithValue($event)">Update: {{ entry()?.taskUpdate }}</div>

        <button mat-icon-button class="row-action" (click)="setUpdateEdited(true)" aria-label="Edit update">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button (click)="openUpdatesSidebar()" class="ml-auto row-action" aria-label="Open task details">
          <mat-icon>view_sidebar</mat-icon>
        </button>
      } @else {
        Update: <input [formControl]="updateFC" aria-label="Task update"/>

        <button mat-icon-button (click)="submitUpdateEditWithValue($event)" aria-label="Save update">
          <mat-icon>check</mat-icon>
        </button>
        <button mat-icon-button (click)="cancelUpdateEdit($event)" aria-label="Cancel editing">
          <mat-icon>cancel</mat-icon>
        </button>
      }
    </div>
  }
</div>
