<button mat-icon-button [matMenuTriggerFor]="menu" class="task-menu-button" aria-label="Example icon-button with a menu">
  <mat-icon>more_vert</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="taskSnoozed.emit()">
    <mat-icon>snooze</mat-icon>
    <span>Snooze</span>
  </button>

  <button mat-menu-item (click)="taskDone.emit()">
    <mat-icon>check</mat-icon>
    <span>Mark as done</span>
  </button>

  <button mat-menu-item disabled>
    <mat-icon>undo</mat-icon>
    <span>Mark back as created</span>
  </button>

  <button mat-menu-item (click)="taskDeleted.emit()">
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>
