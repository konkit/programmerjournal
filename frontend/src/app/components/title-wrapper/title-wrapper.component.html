<header class="title-wrapper">
  <div class="title-row">
    <button mat-icon-button (click)="changeDateBackward()" [attr.aria-label]="previousLabel()" [matTooltip]="previousLabel()">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <h1>{{ title() }}</h1>

    <button mat-icon-button (click)="changeDateForward()" [attr.aria-label]="nextLabel()" [matTooltip]="nextLabel()">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

  <div class="sub-row">
    @if (subtitle()) {
      <span class="subtitle">{{ subtitle() }}</span>
    }
    @if (isCurrent()) {
      <span class="current-chip">{{ currentLabel() }}</span>
    } @else {
      <button mat-stroked-button class="current-button" (click)="goToCurrent()">Go to {{ currentLabel().toLowerCase() }}</button>
    }
  </div>

  @if (pendingImportsCount() > 0) {
    <div class="import-banner" role="status">
      <mat-icon aria-hidden="true">history</mat-icon>
      <span>{{ pendingImportsCount() }} unfinished {{ pendingImportsCount() === 1 ? 'task' : 'tasks' }} from earlier</span>
      <button mat-button (click)="importPastTasks()">Import</button>
    </div>
  }
</header>
